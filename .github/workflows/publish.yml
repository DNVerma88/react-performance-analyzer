name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.0) — updates package.json before publishing"
        type: string
        required: true

# Shows the version in the workflow run list for both tag and manual triggers
run-name: "Publish to npm v${{ inputs.version || github.ref_name }}"

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC Trusted Publishing and provenance

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set version
        if: ${{ inputs.version != '' }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Build, lint, test, audit
        run: npm run prepublishOnly

      - name: Publish
        # Uses OIDC Trusted Publishing when NPM_TOKEN is not set.
        # Falls back to token-based auth when NPM_TOKEN secret is present.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
