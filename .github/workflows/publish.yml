name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build, lint, test and audit without publishing"
        type: boolean
        default: true
        required: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC Trusted Publishing and provenance

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build, lint, test, audit
        run: npm run prepublishOnly

      - name: Publish
        # Uses OIDC Trusted Publishing when NPM_TOKEN is not set.
        # Falls back to token-based auth when NPM_TOKEN secret is present.
        # When triggered via workflow_dispatch with dry_run=true, --dry-run is
        # appended so the full pipeline runs but nothing is published.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
